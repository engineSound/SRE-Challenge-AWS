# Where ExternalSecrets read from: AWS Secrets Manager in us-east-1.
# No credentials here: the External Secrets pod gets its AWS role through
# EKS Pod Identity (Terraform: aws_eks_pod_identity_association.external_secrets),
# which allows only sre-challenge/<this environment>/* and sre-challenge/shared/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
