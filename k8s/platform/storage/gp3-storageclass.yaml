# Default disk type for the cluster. EKS ships only a legacy gp2 class that is
# not marked default, so claims without a class would never get a disk.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
# Create the disk only after the pod is placed, so it lands in the pod's zone.
volumeBindingMode: WaitForFirstConsumer
