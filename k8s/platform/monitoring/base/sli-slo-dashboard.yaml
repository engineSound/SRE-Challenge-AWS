          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "((1 - ((sum(rate(http_requests_total{status=~\"5..\",endpoint!~\"/metrics|/health\"}[30d])) or vector(0)) / sum(rate(http_requests_total{endpoint!~\"/metrics|/health\"}[30d])))) - 0.9995) * 100 / (1 - 0.9995)",
