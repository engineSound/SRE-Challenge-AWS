# Secrets for the monitoring stack, copied from AWS Secrets Manager into the
# `monitoring` namespace by External Secrets. Git holds only secret NAMES.

# Grafana admin login (keys admin-user / admin-password, as the chart expects).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: sre-challenge/preprod/grafana-admin
---
# Alertmanager's whole config, rendered from the Gmail SMTP secret so the
# address and app password never appear in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-config
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: smtp.gmail.com:587
            smtp_require_tls: true
            smtp_from: "{{ .username }}"
            smtp_auth_username: "{{ .username }}"
            smtp_auth_password: "{{ .password }}"
          route:
            receiver: email
            group_by: [alertname, severity]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              # Always-firing heartbeat and helper alerts: don't email.
              - receiver: "null"
                matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: "{{ .to }}"
                  send_resolved: true
  dataFrom:
    - extract:
        key: sre-challenge/shared/alertmanager-smtp
