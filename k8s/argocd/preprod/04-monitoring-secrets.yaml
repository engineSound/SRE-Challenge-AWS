# Wave -2: Grafana admin login and Alertmanager config, pulled from the vault
# BEFORE the monitoring stack starts, so Grafana and Alertmanager boot with them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/engineSound/SRE-Challenge-AWS.git
    targetRevision: main
    path: k8s/platform/monitoring/vault-secrets/preprod
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
