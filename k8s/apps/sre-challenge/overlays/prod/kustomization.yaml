apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-challenge
resources:
  - namespace.yaml
  - ../../base
images:
  # The approved-release step changes only this tag to promote to prod.
  - name: ghcr.io/enginesound/sre-challenge-aws
    newTag: sha-8274d01
patches:
  # Prod is the only public entry point: an AWS Network Load Balancer.
  - target:
      kind: Service
      name: sre-challenge-app
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
  # Fault-injection button, enabled in prod for the Oct 5 demo and kept after the demo by owner's decision.
  # It spends real error budget and the page is public: remove this patch when it is no longer needed.
  - target:
      kind: Deployment
      name: sre-challenge-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ERROR_SIMULATION
            value: "on"
