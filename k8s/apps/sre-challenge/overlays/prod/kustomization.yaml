apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-challenge
resources:
  - namespace.yaml
  - ../../base
images:
  # The approved-release step changes only this tag to promote to prod.
  - name: ghcr.io/enginesound/sre-challenge-aws
    newTag: v4.0
patches:
  # Prod is the only public entry point: an AWS Network Load Balancer.
  - target:
      kind: Service
      name: sre-challenge-app
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
