apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-challenge-preprod
resources:
  - namespace.yaml
  - ../../base
images:
  # CI updates this tag automatically on every push to main.
  - name: ghcr.io/enginesound/sre-challenge-aws
    newTag: v4.1
patches:
  # Preprod stays internal (ClusterIP from the base) and runs smaller.
  - target:
      kind: HorizontalPodAutoscaler
      name: sre-challenge-app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 3
