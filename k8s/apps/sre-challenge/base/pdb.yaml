apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-challenge-app
spec:
  # At most one pod may be voluntarily evicted at a time (node drains, upgrades).
  # Works for any replica count: prod 3 -> keeps 2; preprod 2 -> keeps 1.
  # (minAvailable: 2 blocked every drain in preprod, where the HPA minimum is 2.)
  maxUnavailable: 1
  selector:
    matchLabels:
      app: sre-challenge
