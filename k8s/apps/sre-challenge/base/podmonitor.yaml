# Tells Prometheus to scrape every app pod's /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sre-challenge-app
  labels:
    app: sre-challenge
spec:
  selector:
    matchLabels:
      app: sre-challenge
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      # The app labels requests with `endpoint` (the URL path). Without this, Prometheus'
      # own `endpoint` target label (the port name) wins and renames the app's label.
      honorLabels: true
